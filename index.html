<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050507" />
  <title>Cuaderno de bitácora</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #000000;
  --bg-elevated: #101014;
  --bg-grouped: #1c1c1e;
  --bg-secondary: #2c2c2e;
  --glass: rgba(45,45,52,.52);
  --glass-strong: rgba(58,58,66,.72);
  --glass-clear: rgba(255,255,255,.075);
  --separator: rgba(84,84,88,.52);
  --separator-soft: rgba(255,255,255,.075);
  --text: #ffffff;
  --secondary: #ebebf5;
  --muted: rgba(235,235,245,.60);
  --muted-2: rgba(235,235,245,.34);
  --blue: #0a84ff;
  --blue-soft: rgba(10,132,255,.20);
  --green: #30d158;
  --red: #ff453a;
  --gold: #ffd60a;
  --shadow-card: 0 12px 38px rgba(0,0,0,.34);
  --shadow-glass: 0 16px 48px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(255,255,255,.035);
  --r-card: 24px;
  --r-control: 18px;
  --r-small: 13px;
  --maxw: 980px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  --font-display: "Iowan Old Style", "New York", "Palatino Linotype", Palatino, Georgia, serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
html { background: #000; }
body {
  font-family: var(--font);
  font-size: 14px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  background: #000;
}
body.modal-open { overflow: hidden; position: fixed; width: 100%; }
button, input, select, textarea { font: inherit; }
input, select, textarea { font-size: 16px; }
button { -webkit-tap-highlight-color: transparent; }
.hidden { display: none !important; }

.app {
  position: relative;
  max-width: var(--maxw);
  min-height: 100dvh;
  margin: 0 auto;
  padding-bottom: calc(104px + env(safe-area-inset-bottom));
  overflow-x: hidden;
  background: #000;
}

.hero {
  position: relative;
  min-height: 164px;
  overflow: hidden;
  margin: 0 0 14px;
  padding: calc(env(safe-area-inset-top) + 8px) 14px 12px;
  border-radius: 0 0 30px 30px;
  background: #09090b;
  box-shadow: 0 16px 44px rgba(0,0,0,.44);
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.72) 32%, rgba(0,0,0,.20) 64%, rgba(0,0,0,.05) 100%);
}
.hero-content {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 43%;
  min-height: 140px;
  text-align: center;
}
.hero h1 {
  margin: 0;
  max-width: 5.8em;
  font-family: var(--font-display);
  font-size: clamp(2rem, 8vw, 3.25rem);
  font-weight: 600;
  line-height: .90;
  letter-spacing: -.055em;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,.95), 0 14px 30px rgba(0,0,0,.75);
}
.hero h1 span { display: block; }
.hero-covers {
  position: absolute;
  z-index: 0;
  right: -44px;
  bottom: -2px;
  width: 78%;
  height: 152px;
  pointer-events: none;
}
.hero-cover {
  position: absolute;
  width: 14.8%;
  aspect-ratio: 2/3;
  object-fit: cover;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.13);
  background: #1c1c1e;
  box-shadow: 0 12px 28px rgba(0,0,0,.62);
}
.hero-cover:nth-child(1) { left: 0%; bottom: 51px; transform: rotate(-12deg); z-index: 1; }
.hero-cover:nth-child(2) { left: 8%; bottom: 18px; transform: rotate(-7deg); z-index: 2; }
.hero-cover:nth-child(3) { left: 16%; bottom: 70px; transform: rotate(8deg); z-index: 1; }
.hero-cover:nth-child(4) { left: 24%; bottom: 33px; transform: rotate(3deg); z-index: 3; }
.hero-cover:nth-child(5) { left: 32%; bottom: 4px; transform: rotate(-4deg); z-index: 4; }
.hero-cover:nth-child(6) { left: 40%; bottom: 60px; transform: rotate(10deg); z-index: 2; }
.hero-cover:nth-child(7) { left: 48%; bottom: 22px; transform: rotate(-2deg); z-index: 5; }
.hero-cover:nth-child(8) { left: 56%; bottom: 72px; transform: rotate(-9deg); z-index: 2; }
.hero-cover:nth-child(9) { left: 64%; bottom: 16px; transform: rotate(5deg); z-index: 4; }
.hero-cover:nth-child(10) { left: 72%; bottom: 54px; transform: rotate(-11deg); z-index: 1; }

.screen { display: none; padding: 0 14px 20px; animation: screenIn .28s cubic-bezier(.22,.72,.3,1); }
.screen.active { display: block; }
@keyframes screenIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.section-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 12px; }
.section-title,
.home-section-heading,
.home-subtype-heading,
.top-ten-heading,
.profile-section-title {
  margin: 0;
  font-size: 1.36rem;
  line-height: 1.15;
  font-weight: 650;
  letter-spacing: -.025em;
  color: var(--text);
}
.home-subtype-heading { margin: 2px 2px 8px; font-size: 1.02rem; color: var(--secondary); }

.card, .home-panel, .home-main-card, .entry-row, .rank-card, .stat-card, .favorite-card, .top-ten-row {
  background: var(--bg-grouped);
  border: 1px solid var(--separator-soft);
  box-shadow: var(--shadow-card);
}
.card { padding: 16px; border-radius: var(--r-card); }
.card.soft { background: #121214; box-shadow: none; }
.empty, .home-empty { color: var(--muted); font-size: .88rem; padding: 10px 2px; }

.home-dashboard { display: grid; gap: 18px; }
.home-stats-row, .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.count-card {
  min-width: 0;
  padding: 12px 4px 11px;
  border-radius: 20px;
  background: #1c1c1e;
  border: 1px solid var(--separator-soft);
  text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
.count-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: clamp(.58rem, 2.5vw, .74rem); font-weight: 560; white-space: nowrap; }
.count-value { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: clamp(1.22rem, 5vw, 1.72rem); font-weight: 720; letter-spacing: -.04em; }
.home-section { display: grid; gap: 10px; }
.home-progress-stack { display: grid; gap: 14px; }
.home-progress-group { display: grid; gap: 7px; }
.home-main-card, .home-item-row { display: grid; grid-template-columns: 82px minmax(0,1fr); gap: 13px; align-items: start; padding: 12px; border-radius: 22px; cursor: pointer; }
.home-main-cover, .home-item-cover, .entry-cover, .rank-thumb, .top-ten-cover, .top-ten-cover-empty { aspect-ratio: 2/3; object-fit: cover; background: #2c2c2e; border: 1px solid var(--separator-soft); }
.home-main-cover, .home-item-cover { width: 82px; border-radius: 14px; }
.home-main-label, .home-panel-label { color: var(--blue); font-size: .72rem; font-weight: 650; }
.home-main-title, .home-item-title { margin-top: 4px; font-size: 1.05rem; line-height: 1.16; font-weight: 650; }
.home-main-meta, .home-item-meta, .entry-info, .entry-info-row, .favorite-meta { color: var(--muted); font-size: .78rem; line-height: 1.35; }
.home-main-score, .home-item-score { margin-top: 8px; font-weight: 650; }
.home-panel { padding: 14px; border-radius: var(--r-card); }

.glass-row { display: grid; grid-template-columns: minmax(0,1fr) 44px; gap: 8px; margin-bottom: 10px; }
.glass-pill, .square-toggle,
.filter-picker-button, #statsTypeFilter,
.primary-btn, .secondary-btn, .danger-btn, .ghost-btn,
.close-btn, .nav-plus {
  -webkit-backdrop-filter: blur(26px) saturate(170%);
  backdrop-filter: blur(26px) saturate(170%);
  background: var(--glass);
  border: 1px solid rgba(255,255,255,.17);
  box-shadow: var(--shadow-glass);
}
.glass-pill, .square-toggle { min-height: 44px; border-radius: 17px; color: var(--text); }
.glass-pill { display: flex; align-items: center; padding: 0 13px; }
.glass-pill input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); }
.square-toggle { width: 44px; display: grid; place-items: center; padding: 0; }
.square-toggle.active { color: var(--blue); background: rgba(10,132,255,.20); border-color: rgba(90,180,255,.42); }

.category-tabs { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; margin: 12px 0; }
.category-tab {
  min-width: 0;
  min-height: 58px;
  padding: 7px 3px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border-radius: 18px;
  border: 1px solid var(--separator-soft);
  background: #1c1c1e;
  color: var(--secondary);
  box-shadow: 0 7px 20px rgba(0,0,0,.20);
  cursor: pointer;
  transition: transform .16s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
}
.category-tab:active { transform: scale(.96); }
.category-tab.active { color: #fff; background: var(--blue); border-color: rgba(255,255,255,.24); box-shadow: 0 10px 28px rgba(10,132,255,.34), inset 0 1px 0 rgba(255,255,255,.30); }
.type-tab-icon { font-size: 1.3rem; line-height: 1; }
.type-tab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .66rem; font-weight: 600; }

.recommendation-tabs { grid-template-columns: repeat(4, minmax(0,1fr)); margin: 0; }
.recommendation-status { min-height: 1.2em; color: var(--muted); font-size: .82rem; line-height: 1.4; }
.recommendation-toolbar { display: flex; align-items: center; justify-content: flex-end; min-height: 32px; }
.recommendation-refresh {
  min-height: 32px;
  padding: 0 12px;
  border-radius: 13px;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.075);
  color: var(--blue);
  font-size: .73rem;
  font-weight: 650;
  cursor: pointer;
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  backdrop-filter: blur(20px) saturate(160%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
}
.recommendation-refresh:active { transform: scale(.97); }
.recommendation-status.loading { color: var(--secondary); }
.recommendation-results { display: grid; gap: 10px; }
.recommendation-card {
  display: grid;
  grid-template-columns: 76px minmax(0,1fr);
  gap: 13px;
  align-items: start;
  min-height: 132px;
  padding: 11px;
  border-radius: 22px;
  background: var(--bg-grouped);
  border: 1px solid var(--separator-soft);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.recommendation-cover,
.recommendation-cover-placeholder {
  width: 76px;
  aspect-ratio: 2/3;
  object-fit: cover;
  border-radius: 13px;
  background: var(--bg-secondary);
  border: 1px solid var(--separator-soft);
}
.recommendation-cover-placeholder {
  display: grid;
  place-items: center;
  color: var(--muted-2);
  font-size: 1.55rem;
}
.recommendation-main { min-width: 0; padding-top: 2px; }
.recommendation-kicker { color: var(--muted); font-size: .7rem; line-height: 1.2; }
.recommendation-title { margin-top: 5px; font-size: 1.02rem; line-height: 1.16; font-weight: 680; letter-spacing: -.018em; }
.recommendation-author { margin-top: 4px; color: var(--secondary); font-size: .78rem; line-height: 1.3; font-weight: 560; }
.recommendation-meta { margin-top: 7px; color: var(--secondary); font-size: .77rem; line-height: 1.3; }
.recommendation-reason { margin-top: 8px; color: var(--muted); font-size: .76rem; line-height: 1.38; }
.recommendation-source { margin-top: 8px; color: var(--muted-2); font-size: .64rem; }
.recommendation-error { color: #ff9f9a; }
@media (min-width: 760px) {
  .recommendation-results { grid-template-columns: 1fr 1fr; }
}

.filter-buttons { position: relative; z-index: 30; display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; margin-bottom: 12px; }
.filter-picker { position: relative; min-width: 0; }
.filter-picker-button {
  width: 100%;
  min-height: 44px;
  border-radius: 17px;
  color: var(--text);
  font-size: .78rem;
  font-weight: 590;
  padding: 0 11px;
  cursor: pointer;
}
.filter-picker-button.active { background: rgba(10,132,255,.28); border-color: rgba(90,180,255,.48); }
.filter-menu, .floating-filter-menu {
  position: absolute;
  z-index: 1000;
  top: calc(100% + 7px);
  left: 0;
  width: min(230px, 78vw);
  max-height: 300px;
  overflow: auto;
  padding: 7px;
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(35,35,42,.82);
  -webkit-backdrop-filter: blur(34px) saturate(180%);
  backdrop-filter: blur(34px) saturate(180%);
  box-shadow: 0 24px 65px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.17);
}
.filter-picker:nth-child(3) .filter-menu { right: 0; left: auto; }
.floating-filter-menu { position: fixed; top: auto; left: auto; }
.filter-option, .floating-filter-option {
  width: 100%; min-height: 40px; display: block; border: 0; border-radius: 14px; background: transparent; color: var(--text); text-align: left; padding: 0 12px; cursor: pointer;
}
.filter-option.active, .floating-filter-option.active { color: #fff; background: var(--blue); }

.library-content-title { margin: 12px 2px 9px; font-size: 1.1rem; font-weight: 650; }
.entries-list { display: grid; gap: 10px; }
.entry-row {
  position: relative;
  display: grid;
  grid-template-columns: 72px minmax(0,1fr) auto;
  gap: 12px;
  min-height: 124px;
  padding: 11px;
  border-radius: 22px;
  cursor: pointer;
  transition: transform .17s ease, background .17s ease;
}
.entry-row:active { transform: scale(.988); background: #242426; }
.entry-cover { width: 72px; border-radius: 13px; }
.entry-body { min-width: 0; align-self: start; }
.entry-meta-top, .detail-meta { color: var(--muted); font-size: .73rem; line-height: 1.2; }
.entry-title { margin: 5px 0 6px; font-size: 1.03rem; line-height: 1.15; font-weight: 670; letter-spacing: -.018em; }
.entry-genre-line { color: var(--secondary); font-size: .79rem; line-height: 1.3; }
.entry-chip-row, .detail-chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.entry-chip, .chip { display: inline-flex; align-items: center; min-height: 25px; padding: 0 9px; border-radius: 999px; background: #2c2c2e; color: var(--secondary); font-size: .68rem; border: 1px solid var(--separator-soft); }
.entry-date-line { margin-top: 7px; color: var(--muted); font-size: .72rem; white-space: nowrap; }
.entry-side { min-width: 52px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; }
.entry-score-badge, .detail-score, .top-ten-score {
  display: grid;
  place-items: center;
  min-width: 50px;
  min-height: 50px;
  padding: 6px 8px;
  border-radius: 17px;
  background: #2c2c2e;
  border: 1px solid var(--separator-soft);
}
.score-label { color: var(--muted); font-size: .54rem; font-weight: 600; text-align: center; }
.rating { color: var(--secondary); font-size: 1.06rem; line-height: 1; font-weight: 720; text-align: center; }
.rating-gold { color: var(--gold); }
.entry-side .platinum-trophy { margin-top: auto; }
.platinum-trophy { display: grid; place-items: center; width: 42px; height: 42px; }
.platinum-trophy img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
.detail-score-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.detail-score-row .detail-score { flex: 0 0 auto; }
.detail-score-row .platinum-trophy { width: 54px; height: 54px; }

.profile-grid { display: grid; gap: 12px; }
.profile-section-title { margin-bottom: 12px; }
.profile-summary { display: grid; gap: 7px; }
.action-grid, .form-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.profile-actions { margin-top: 14px; }
.primary-btn, .secondary-btn, .danger-btn, .ghost-btn {
  min-height: 46px;
  border-radius: 17px;
  color: var(--text);
  padding: 0 14px;
  font-weight: 620;
  cursor: pointer;
}
.primary-btn { background: rgba(10,132,255,.72); border-color: rgba(120,205,255,.38); }
.secondary-btn { background: var(--glass); }
.danger-btn { background: rgba(255,69,58,.24); border-color: rgba(255,120,112,.32); color: #ff9f9a; }
.ghost-btn { background: transparent; box-shadow: none; border-color: var(--separator); color: var(--secondary); }
.version-number { font-size: .92rem; font-weight: 650; color: var(--text); }
.version-description { margin-top: 6px; color: var(--muted); font-size: .72rem; line-height: 1.38; }
.incomplete-list { display: grid; gap: 8px; }
.incomplete-item { padding: 11px 12px; border-radius: 16px; background: #2c2c2e; }
.incomplete-item-title { font-weight: 650; }
.incomplete-item-missing { margin-top: 4px; color: var(--muted); font-size: .72rem; }

.top-ten-panel { display: grid; gap: 12px; margin-top: 18px; }
.top-ten-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top-ten-heading { white-space: nowrap; }
#statsTypeFilter {
  width: min(48vw, 290px);
  min-height: 48px;
  border-radius: 18px;
  color: var(--text);
  padding: 0 40px 0 14px;
  font-size: .94rem;
  font-weight: 620;
  outline: 0;
}
.top-ten-list { display: grid; gap: 8px; }
.top-ten-row { display: grid; grid-template-columns: 28px 46px minmax(0,1fr) auto; gap: 10px; align-items: center; min-height: 74px; padding: 9px 11px; border-radius: 20px; cursor: pointer; }
.top-ten-rank { color: var(--muted); font-size: .76rem; font-weight: 680; text-align: center; }
.top-ten-cover, .top-ten-cover-empty { width: 46px; border-radius: 9px; }
.top-ten-main { min-width: 0; }
.top-ten-title { color: var(--text); font-size: .89rem; line-height: 1.18; font-weight: 650; white-space: normal; }
.top-ten-year { margin-top: 4px; color: var(--muted); font-size: .69rem; }
.top-ten-score .rating { font-size: .96rem; }

.bottom-nav {
  position: fixed;
  z-index: 100;
  left: 50%;
  bottom: calc(10px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(calc(100% - 20px), 720px);
  padding: 7px 9px;
  border-radius: 30px;
  background: rgba(39,39,46,.64);
  border: 1px solid rgba(255,255,255,.20);
  -webkit-backdrop-filter: blur(36px) saturate(190%);
  backdrop-filter: blur(36px) saturate(190%);
  box-shadow: 0 20px 58px rgba(0,0,0,.66), inset 0 1px 0 rgba(255,255,255,.21), inset 0 -1px 0 rgba(255,255,255,.04);
}
.bottom-nav-inner { display: grid; grid-template-columns: 1fr 1fr 62px 1fr 1fr; align-items: center; gap: 4px; }
.nav-btn { min-width: 0; min-height: 54px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; border-radius: 18px; background: transparent; color: var(--muted); font-size: .65rem; font-weight: 500; cursor: pointer; transition: background .2s ease, color .2s ease, transform .16s ease; }
.nav-btn:active { transform: scale(.94); }
.nav-btn .icon { font-size: 1.24rem; line-height: 1; filter: saturate(.7); }
.nav-btn.active { color: #fff; background: rgba(255,255,255,.11); }
.nav-btn.active .icon { filter: none; }
.nav-plus { width: 58px; height: 58px; border-radius: 50%; color: #fff; font-size: 2rem; line-height: 1; background: rgba(10,132,255,.78); border-color: rgba(140,210,255,.48); cursor: pointer; }

.modal-backdrop {
  position: fixed;
  z-index: 300;
  inset: 0;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding-top: env(safe-area-inset-top);
  background: rgba(0,0,0,.54);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.modal-backdrop.show { display: flex; animation: backdropIn .22s ease; }
@keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  width: 100%;
  max-width: var(--maxw);
  max-height: 92dvh;
  overflow: auto;
  padding: 11px 14px calc(24px + env(safe-area-inset-bottom));
  border-radius: 30px 30px 0 0;
  background: rgba(28,28,32,.88);
  border: 1px solid rgba(255,255,255,.15);
  -webkit-backdrop-filter: blur(38px) saturate(180%);
  backdrop-filter: blur(38px) saturate(180%);
  box-shadow: 0 -24px 70px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.16);
  animation: sheetUp .34s cubic-bezier(.22,.72,.22,1);
}
@keyframes sheetUp { from { transform: translateY(32px); opacity: .5; } to { transform: none; opacity: 1; } }
.sheet-handle { width: 38px; height: 5px; margin: 0 auto 12px; border-radius: 999px; background: rgba(235,235,245,.32); }
.sheet-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }

  <script>
  (() => {
    'use strict';

    const DB_NAME = 'cuaderno_bitacora_nueva_app';
    const DB_VERSION = 1;
    const STORE_NAME = 'kv';
    const ENTRIES_KEY = 'entries';
    const OMDB_API_KEY = '817ab20e';
    const GAME_DB_BASES = ['https://app.lizardbyte.dev/GameDB', 'https://db.lizardbyte.dev'];
    const RECOMMENDATIONS_API = 'https://cuaderno-recomendaciones.aj-luque.workers.dev/';

    const TYPES = ['Película', 'Serie', 'Libro', 'Videojuego'];
    const TYPE_ICONS = { 'Película': '🎬', 'Serie': '📺', 'Libro': '📖', 'Videojuego': '🎮' };
    const TYPE_LABELS = { 'Película': 'Películas', 'Serie': 'Series', 'Libro': 'Libros', 'Videojuego': 'Videojuegos' };
    const TYPE_TABS = [['Todos', 'Todo', '🧭'], ['Película', 'Películas', '🎬'], ['Serie', 'Series', '📺'], ['Libro', 'Libros', '📖'], ['Videojuego', 'Videojuegos', '🎮']];
    const STATUS_MAP = {
      'Película': ['Vista', 'Pendiente', 'Abandonada'],
      'Serie': ['Viendo', 'Vista', 'Pendiente', 'Abandonada'],
      'Libro': ['Leyendo', 'Leído', 'Pendiente', 'Abandonado'],
      'Videojuego': ['Jugando', 'Completado', 'Pendiente', 'Abandonado']
    };

    const GENRE_TRANSLATIONS = {
      'Action': 'Acción', 'Adventure': 'Aventura', 'Animation': 'Animación', 'Biography': 'Biografía', 'Comedy': 'Comedia', 'Crime': 'Crimen', 'Documentary': 'Documental', 'Drama': 'Drama', 'Family': 'Familiar', 'Fantasy': 'Fantasía', 'Film-Noir': 'Cine negro', 'History': 'Historia', 'Horror': 'Terror', 'Music': 'Música', 'Mystery': 'Misterio', 'Romance': 'Romance', 'Sci-Fi': 'Ciencia ficción', 'Sport': 'Deporte', 'Thriller': 'Suspense', 'War': 'Bélica', 'Western': 'Western',
      'Children': 'Infantil', 'Juvenile Fiction': 'Ficción juvenil', 'Fiction': 'Ficción', 'Nonfiction': 'No ficción', 'Science Fiction': 'Ciencia ficción', 'Detective and mystery stories': 'Misterio', 'Historical fiction': 'Novela histórica', 'Love stories': 'Romance', 'Adventure stories': 'Aventura', 'Fantasy fiction': 'Fantasía', 'Horror tales': 'Terror'
    };
    const GAME_GENRE_ES = {
      'point and click': 'Point and click', 'fighting': 'Lucha', 'shooter': 'Acción', 'music': 'Música', 'platform': 'Plataformas', 'puzzle': 'Puzles', 'racing': 'Carreras', 'real time strategy rts': 'Estrategia', 'role playing rpg': 'Rol', 'simulator': 'Simulación', 'sport': 'Deportes', 'strategy': 'Estrategia', 'turn based strategy tbs': 'Estrategia por turnos', 'tactical': 'Táctico', 'hack and slash beat em up': 'Acción', 'quiz trivia': 'Preguntas', 'pinball': 'Pinball', 'adventure': 'Aventuras', 'indie': 'Indie', 'arcade': 'Arcade', 'visual novel': 'Novela visual', 'card board game': 'Cartas y mesa', 'moba': 'MOBA', 'action': 'Acción', 'fantasy': 'Fantasía', 'science fiction': 'Ciencia ficción', 'horror': 'Terror', 'thriller': 'Suspense', 'survival': 'Supervivencia', 'historical': 'Histórico', 'stealth': 'Sigilo', 'comedy': 'Comedia', 'business': 'Gestión', 'drama': 'Drama', 'sandbox': 'Sandbox', 'open world': 'Mundo abierto', 'warfare': 'Bélico', 'western': 'Oeste'
    };

    let db = null;
    let entries = [];
    let editingId = null;
    let currentCover = '';
    let currentScreen = 'home';
    let libraryType = '';
    let statsTopType = 'Película';
    let scrollLockY = 0;
    let onlineResults = [];
    let heroCoverCacheKey = '';
    let heroCoverCache = [];
    let recommendationType = '';
    let recommendationResults = [];
    const recommendationCache = Object.fromEntries(TYPES.map(type => [type, []]));
    let recommendationLoading = false;
    let recommendationError = '';

    const qs = (selector, root = document) => root.querySelector(selector);
    const qsa = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const clean = value => value === undefined || value === null ? '' : String(value).trim();
    const escapeHtml = value => clean(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[ch]));
    const unique = list => Array.from(new Set((list || []).filter(Boolean)));
    const makeId = () => crypto?.randomUUID ? crypto.randomUUID() : `id_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
    const todayStamp = () => new Date().toISOString();

    function normalizeText(value) {
      return clean(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/&/g, ' and ').replace(/\+/g, ' plus ').replace(/[^a-z0-9]+/g, ' ').trim();
    }
    function normalizeYear(value) {
      const text = clean(value);
      const match = text.match(/\d{4}/);
      return match ? match[0] : '';
    }
    function translateGenreList(raw = '') {
      if (!raw || raw === 'N/A') return '';
      return clean(raw).split(',').map(part => part.trim()).filter(Boolean).map(part => GENRE_TRANSLATIONS[part] || part).join(', ');
    }

    function normalizeEntry(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const type = TYPES.includes(raw.type) ? raw.type : '';
      if (!type) return null;
      const rating = clean(raw.rating);
      return {
        id: clean(raw.id) || makeId(),
        type,
        title: clean(raw.title),
        person: clean(raw.person || raw.director || raw.author || raw.developer),
        year: normalizeYear(raw.year),
        genre: clean(raw.genre),
        status: clean(raw.status),
        rating,
        platform: clean(raw.platform),
        language: clean(raw.language) || (type === 'Libro' ? 'Castellano' : ''),
        list: clean(raw.list),
        cover: clean(raw.cover || raw.image),
        comments: clean(raw.comments || raw.comment),
        date: clean(raw.date),
        startDate: clean(raw.startDate),
        endDate: clean(raw.endDate),
        playedYear: clean(raw.playedYear),
        platinumTrophy: type === 'Videojuego' && (raw.platinumTrophy === true || clean(raw.platinumTrophy).toLowerCase() === 'true' || clean(raw.platinumTrophy).toLowerCase() === 'sí' || clean(raw.platinumTrophy).toLowerCase() === 'si'),
        createdAt: clean(raw.createdAt) || todayStamp(),
        updatedAt: clean(raw.updatedAt) || clean(raw.createdAt) || todayStamp()
      };
    }
    function supportedEntries() { return entries.filter(entry => TYPES.includes(entry.type)); }

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

    function entryHasList(entry, listName) {
      return clean(entry.list).split(',').map(v => v.trim()).filter(Boolean).some(v => v.toLowerCase() === clean(listName).toLowerCase());
    }
    function getUniqueLists() {
      return unique(supportedEntries().flatMap(entry => clean(entry.list).split(',').map(v => v.trim()).filter(Boolean))).sort((a, b) => a.localeCompare(b));
    }
    function getBestRated(type = '', limit = 10) {
      return supportedEntries()
        .filter(entry => (!type || type === 'Todos' || entry.type === type) && clean(entry.rating) !== '' && !Number.isNaN(Number(entry.rating)))
        .sort((a, b) => Number(b.rating) - Number(a.rating) || clean(a.title).localeCompare(clean(b.title)))
        .slice(0, limit);
    }
    function latestEntries(limit = 4) {
      return supportedEntries().sort((a, b) => getSortDateKey(b).localeCompare(getSortDateKey(a)) || clean(b.updatedAt).localeCompare(clean(a.updatedAt))).slice(0, limit);
    }

    function lockBody() {
      scrollLockY = window.scrollY || 0;
      document.body.classList.add('modal-open');
      document.body.style.top = `-${scrollLockY}px`;
    }
    function unlockBody() {
      document.body.classList.remove('modal-open');
      document.body.style.top = '';
      window.scrollTo(0, scrollLockY || 0);
    }
    function openModal(id) { qs(`#${id}`)?.classList.add('show'); lockBody(); }
    function closeModal(id) { qs(`#${id}`)?.classList.remove('show'); if (!qsa('.modal-backdrop.show').length) unlockBody(); }

    function placeholderCover(className = 'entry-cover') { return `<div class="${className}"></div>`; }
    function shuffled(list) {
      const data = [...list];
      for (let index = data.length - 1; index > 0; index -= 1) {
        const swap = Math.floor(Math.random() * (index + 1));
        [data[index], data[swap]] = [data[swap], data[index]];
      }
      return data;
    }
    function renderHeroCovers(type = '', forceShuffle = false) {
      const normalizedType = type && type !== 'Todos' ? type : '';
      const allCovers = supportedEntries().filter(entry => entry.cover);
      const typedCovers = normalizedType ? allCovers.filter(entry => entry.type === normalizedType) : allCovers;
      const pool = typedCovers.length ? typedCovers : allCovers;
      const key = `${normalizedType || 'Todos'}::${pool.map(entry => entry.id).sort().join('|')}`;
      if (forceShuffle || key !== heroCoverCacheKey) {
        heroCoverCacheKey = key;
        heroCoverCache = shuffled(pool).slice(0, 10);
      }
      qs('#heroCovers').innerHTML = heroCoverCache.map(entry => `<img class="hero-cover" src="${escapeHtml(entry.cover)}" alt="${escapeHtml(entry.title)}">`).join('');
    }
    function countByType(type) { return supportedEntries().filter(e => e.type === type).length; }
    function renderCountCards() {
      return TYPES.map(type => `<div class="count-card"><div class="count-label">${TYPE_LABELS[type]}</div><div class="count-value">${TYPE_ICONS[type]} ${countByType(type)}</div></div>`).join('');
    }
    function renderCountRow() {
      return `<div class="home-stats-row count-grid">${renderCountCards()}</div>`;
    }
    function homeEntryRow(entry, showScore = true) {
      const date = getDisplayDate(entry);
      return `<article class="home-item-row" data-open-id="${escapeHtml(entry.id)}">
        ${entry.cover ? `<img class="home-item-cover" src="${escapeHtml(entry.cover)}" alt="${escapeHtml(entry.title)}">` : placeholderCover('home-item-cover')}
        <div><div class="home-item-title">${escapeHtml(entry.title)}</div><div class="home-item-meta">${TYPE_ICONS[entry.type]} ${escapeHtml(entry.type)}${entry.year ? ` · ${escapeHtml(entry.year)}` : ''}${date ? ` · ${escapeHtml(date)}` : ''}</div></div>
        ${showScore ? `<div class="home-item-score">${formatRating(entry.rating)}</div>` : ''}
      </article>`;
    }
    function recommendationSectionMarkup() {
      const buttons = TYPES.map(type => `<button type="button" class="category-tab ${recommendationType === type ? 'active' : ''}" data-recommendation-type="${escapeHtml(type)}" aria-label="Recomendar ${escapeHtml(TYPE_LABELS[type].toLowerCase())}"><span class="type-tab-icon">${TYPE_ICONS[type]}</span><span class="type-tab-label">${escapeHtml(TYPE_LABELS[type])}</span></button>`).join('');
      const status = recommendationLoading
        ? '<div class="recommendation-status loading">Analizando tu bitácora y buscando portadas…</div>'
        : recommendationError
          ? `<div class="recommendation-status recommendation-error">${escapeHtml(recommendationError)}</div>`
          : '';
      const refresh = recommendationType && recommendationResults.length && !recommendationLoading
        ? '<div class="recommendation-toolbar"><button type="button" class="recommendation-refresh" data-refresh-recommendations>Nuevas recomendaciones</button></div>'
        : '';
      const results = recommendationResults.length
        ? `<div class="recommendation-results">${recommendationResults.map((item, index) => {
            const cover = item.image
              ? `<img class="recommendation-cover" src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}" loading="lazy">`
              : `<div class="recommendation-cover-placeholder" aria-hidden="true">${TYPE_ICONS[recommendationType] || '🎯'}</div>`;
            const meta = [item.year, item.genre].filter(Boolean).join(' · ');
            const author = recommendationType === 'Libro' && item.person
              ? `<div class="recommendation-author">${escapeHtml(item.person)}</div>`
              : '';
            return `<article class="recommendation-card">${cover}<div class="recommendation-main"><div class="recommendation-kicker">Recomendación ${index + 1}</div><div class="recommendation-title">${escapeHtml(item.title)}</div>${author}${meta ? `<div class="recommendation-meta">${escapeHtml(meta)}</div>` : ''}${item.reason ? `<div class="recommendation-reason">${escapeHtml(item.reason)}</div>` : ''}${item.source ? `<div class="recommendation-source">${escapeHtml(item.source)}</div>` : ''}</div></article>`;
          }).join('')}</div>`
        : '';
      return `<section class="home-section"><h2 class="home-section-heading">🎯 Recomendaciones</h2><div class="category-tabs recommendation-tabs">${buttons}</div>${status}${refresh}${results}</section>`;
    }

    function recommendationDataset(type) {
      return supportedEntries()
        .filter(entry => entry.type === type)
        .map(entry => ({
          title: clean(entry.title),
          genre: clean(entry.genre),
          year: clean(entry.year),
          rating: clean(entry.rating),
          comment: clean(entry.comments)
        }));
    }

    function parseRecommendationText(text) {
      const cleaned = clean(text).replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '');
      let data;
      try { data = JSON.parse(cleaned); }
      catch (_) {
        const start = cleaned.indexOf('[');
        const end = cleaned.lastIndexOf(']');
        if (start < 0 || end <= start) throw new Error('Claude no devolvió una lista válida.');
        data = JSON.parse(cleaned.slice(start, end + 1));
      }
      if (!Array.isArray(data)) throw new Error('Claude no devolvió una lista válida.');
      return data.map(item => ({
        title: clean(item?.title || item?.titulo),
        originalTitle: clean(item?.originalTitle || item?.tituloOriginal || item?.original_title),
        year: normalizeYear(item?.year || item?.año),
        reason: clean(item?.reason || item?.motivo)
      })).filter(item => item.title).slice(0, 5);
    }

    function recommendationMatchScore(candidate, recommendation) {
      const candidateTitles = unique([candidate?.title, candidate?.originalTitle].map(normalizeText));
      const wantedTitles = unique([recommendation?.title, recommendation?.originalTitle].map(normalizeText));
      let score = 0;
      for (const wanted of wantedTitles) {
        for (const candidateTitle of candidateTitles) {
          if (!wanted || !candidateTitle) continue;
          if (wanted === candidateTitle) score = Math.max(score, 1000);
          else if (candidateTitle.includes(wanted) || wanted.includes(candidateTitle)) score = Math.max(score, 760 - Math.abs(candidateTitle.length - wanted.length));
          else {
            const tokens = wanted.split(' ').filter(token => token.length > 2);
            const common = tokens.filter(token => candidateTitle.includes(token)).length;
            if (tokens.length) score = Math.max(score, Math.round(520 * common / tokens.length));
          }
        }
      }
      const wantedYear = normalizeYear(recommendation?.year);
      const candidateYear = normalizeYear(candidate?.year);
      if (wantedYear && candidateYear) score += wantedYear === candidateYear ? 170 : -Math.min(120, Math.abs(Number(wantedYear) - Number(candidateYear)) * 24);
      if (candidate?.image) score += 45;
      if (candidate?.genre) score += 15;
      return score;
    }

    async function searchRecommendationSources(type, recommendation) {
      const queries = unique([recommendation.originalTitle, recommendation.title].map(clean)).filter(Boolean);
      let results = [];
      for (const query of queries) {
        try {
          const found = type === 'Libro'
            ? await searchOpenLibrary(query)
            : type === 'Videojuego'
              ? await searchGameDb(query)
              : await searchOmdb(type, query);
          results = results.concat(found || []);
        } catch (error) {
          console.warn('No se pudo enriquecer una recomendación:', query, error);
        }
      }
      const best = results
        .map(item => ({ item, score: recommendationMatchScore(item, recommendation) }))
        .sort((a, b) => b.score - a.score)[0];
      return best && best.score >= 430 ? best.item : null;
    }

    async function enrichRecommendation(type, recommendation) {
      const match = await searchRecommendationSources(type, recommendation);
      return {
        ...recommendation,
        title: recommendation.title || clean(match?.title),
        originalTitle: recommendation.originalTitle || clean(match?.originalTitle),
        year: clean(match?.year) || recommendation.year,
        person: clean(match?.person),
        genre: clean(match?.genre),
        image: clean(match?.image),
        source: clean(match?.source)
      };
    }

    async function generateRecommendations(type, force = false) {
      if (recommendationLoading) return;
      recommendationType = type;
      if (!force && recommendationCache[type]?.length) {
        recommendationResults = recommendationCache[type];
        recommendationError = '';
        renderHome();
        return;
      }
      const records = recommendationDataset(type);
      recommendationResults = [];
      recommendationError = '';
      recommendationLoading = true;
      renderHome();

      try {
        const compactRecords = records.map(item => [item.title, item.genre, item.year, item.rating, item.comment]);
        const prompt = `Actúa como un recomendador personal exigente. Analiza las notas, géneros y comentarios del usuario, dando más peso a las notas altas y a lo que expresa en sus comentarios, pero teniendo también en cuenta aquello que critica o considera repetitivo. Recomienda exactamente 5 ${TYPE_LABELS[type].toLowerCase()} que no aparezcan ya en su bitácora. Busca un equilibrio entre 3 opciones muy ajustadas a sus gustos, 1 opción algo diferente pero compatible y 1 opción sorprendente. Evita recomendaciones genéricas, secuelas obvias y títulos demasiado parecidos entre sí. Devuelve únicamente un JSON válido, sin Markdown ni texto adicional. Cada motivo debe tener como máximo 12 palabras. Usa siempre en "title" el título oficial o más conocido en España, nunca una traducción literal inventada. Formato exacto: [{"title":"Título oficial en España","originalTitle":"Título original","year":"2024","reason":"Motivo muy breve"}].\n\nCada registro sigue el orden [título, género, año, nota, comentario].\nRegistros del usuario (${type}):\n${JSON.stringify(compactRecords)}`;
        const response = await fetch(RECOMMENDATIONS_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await response.json();
        if (!response.ok || data?.type === 'error' || data?.error) {
          const message = data?.error?.message || data?.error || 'No se pudieron generar las recomendaciones.';
          throw new Error(message);
        }
        if (data?.stop_reason === 'max_tokens') {
          throw new Error('La respuesta de Claude quedó incompleta porque el límite del Worker es demasiado bajo.');
        }
        const text = Array.isArray(data?.content) ? data.content.map(part => part?.text || '').join('') : '';
        const parsed = parseRecommendationText(text);
        if (!parsed.length) throw new Error('Claude no devolvió recomendaciones válidas.');
        recommendationResults = await Promise.all(parsed.map(item => enrichRecommendation(type, item)));
        recommendationCache[type] = recommendationResults;
      } catch (error) {
        console.error(error);
        recommendationError = clean(error?.message) || 'No se pudieron obtener las recomendaciones. Inténtalo de nuevo.';
      } finally {
        recommendationLoading = false;
        renderHome();
      }
    }

    function positionFloatingFilterMenu(button, menu) {
      const rect = button.getBoundingClientRect();
      const width = Math.min(280, window.innerWidth - 20);
      let left = rect.left;
      if (left + width > window.innerWidth - 10) left = window.innerWidth - width - 10;
      if (left < 10) left = 10;
      menu.style.width = `${width}px`;
      menu.style.left = `${left}px`;
      menu.style.top = `${rect.bottom + 7}px`;
      requestAnimationFrame(() => {
        const menuRect = menu.getBoundingClientRect();
        if (menuRect.bottom > window.innerHeight - 10) {
          const above = rect.top - menuRect.height - 7;
          menu.style.top = `${Math.max(10, above)}px`;
        }

      if (search) data = data.filter(e => [e.title, e.person, e.genre, e.platform, e.language, e.list, e.comments, e.playedYear].join(' ').toLowerCase().includes(search));
      if (quick === 'EnCurso') data = data.filter(e => /viendo|leyendo|jugando/i.test(e.status || ''));
      if (quick === 'Pendiente') data = data.filter(e => /pendiente/i.test(e.status || ''));

      if (quick === 'SinNota') data = data.filter(e => clean(e.rating) === '');
      if (quick === 'ConNota') data = data.filter(e => clean(e.rating) !== '');
      data.sort((a, b) => {
        if (sort === 'dateAsc') return getSortDateKey(a).localeCompare(getSortDateKey(b)) || clean(a.title).localeCompare(clean(b.title));
        if (sort === 'ratingDesc') return (Number(b.rating || -1) - Number(a.rating || -1)) || clean(a.title).localeCompare(clean(b.title));
        if (sort === 'ratingAsc') return (Number(a.rating || 99) - Number(b.rating || 99)) || clean(a.title).localeCompare(clean(b.title));
        if (sort === 'titleAsc') return clean(a.title).localeCompare(clean(b.title));
        return getSortDateKey(b).localeCompare(getSortDateKey(a)) || clean(b.updatedAt).localeCompare(clean(a.updatedAt));
      });
      return data;

      pushIfEmpty('portada', entry.cover);

      if (!isEntryInProgress(entry)) pushIfEmpty('nota', entry.rating);
      return missing;

    function fieldTitle(label) {
      const text = String(label || '').toLocaleLowerCase('es-ES');
      return text ? text.charAt(0).toLocaleUpperCase('es-ES') + text.slice(1) : '';
    }
    function detailBox(label, value) {
      if (!value) return '';
      const isDateField = ['Fecha', 'Inicio', 'Finalización'].includes(label);
      const labelText = fieldTitle(label);
      const valueClass = `detail-box-value${isDateField ? ' date-value' : ''}`;
      return `<div class="detail-box${isDateField ? ' date-field' : ''}"><div class="k">${escapeHtml(labelText)}</div><div class="${valueClass}">${escapeHtml(value)}</div></div>`;
    }
    function openDetail(id) {
      const entry = entries.find(e => e.id === id);
      if (!entry) return;
      const details = [];
      if (entry.type === 'Película') details.push(detailBox('Fecha', formatDate(entry.date)));
      if (['Serie', 'Libro'].includes(entry.type)) {
        details.push(detailBox('Inicio', formatDate(entry.startDate)));
        details.push(detailBox('Finalización', formatDate(entry.endDate)));
      }
      if (entry.type === 'Videojuego') details.push(detailBox('Fecha', entry.playedYear));
      details.push(detailBox(detailLabelForPerson(entry), entry.person));
      details.push(detailBox('Idioma', entry.language));
      details.push(detailBox('Lista', entry.list));
      const detailChips = [entry.status, entry.platform].filter(Boolean).map(value => `<span class="entry-chip">${escapeHtml(value)}</span>`).join('');
      qs('#detailContent').innerHTML = `<div class="detail-actions"><button class="secondary-btn" id="detailBack">Volver</button><button class="primary-btn" id="detailEdit">Editar</button><button class="danger-btn" id="detailDelete">Borrar</button></div>
        <div class="detail-hero">${entry.cover ? `<img class="detail-cover" data-full-cover="${escapeHtml(entry.cover)}" src="${escapeHtml(entry.cover)}" alt="${escapeHtml(entry.title)}">` : '<div class="detail-cover"></div>'}<div><div class="detail-meta">${escapeHtml([TYPE_ICONS[entry.type], entry.year || 'Sin año'].filter(Boolean).join(' '))}</div><h3 class="detail-title">${escapeHtml(entry.title)}</h3>${entry.genre ? `<div class="detail-genre-line">${escapeHtml(entry.genre)}</div>` : ''}${detailChips ? `<div class="entry-chip-row detail-chip-row">${detailChips}</div>` : ''}${clean(entry.rating) !== '' || (entry.type === 'Videojuego' && entry.platinumTrophy) ? `<div class="detail-score-row">${clean(entry.rating) !== '' ? `<div class="detail-score"><span class="score-label">Nota</span>${formatRating(entry.rating)}</div>` : ''}${entry.type === 'Videojuego' && entry.platinumTrophy ? platinumTrophyIcon() : ''}</div>` : ''}</div></div>
        <div class="detail-grid">${details.filter(Boolean).join('')}</div>${entry.comments ? `<div class="detail-comment"><div class="detail-comment-title">Comentario</div>${escapeHtml(entry.comments)}</div>` : ''}`;
      qs('#detailBack').addEventListener('click', () => closeModal('detailModal'));
      qs('#detailEdit').addEventListener('click', () => { closeModal('detailModal'); fillForm(entry); });
      qs('#detailDelete').addEventListener('click', async () => {
        if (!confirm(`¿Seguro que quieres borrar "${entry.title}"?`)) return;
        entries = entries.filter(e => e.id !== entry.id);
        await saveEntries();
        closeModal('detailModal');
        renderAll();
      });
      qs('[data-full-cover]', qs('#detailContent'))?.addEventListener('click', event => openCoverLightbox(event.currentTarget.dataset.fullCover));
      openModal('detailModal');
    }

    function openCoverLightbox(src) { qs('#coverLightboxImg').src = src; qs('#coverLightbox').classList.add('show'); }
    function closeCoverLightbox() { qs('#coverLightbox').classList.remove('show'); qs('#coverLightboxImg').src = ''; }

    function resizeImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(reader.error);
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxWidth = 900;
            const ratio = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * ratio);
            canvas.height = Math.round(img.height * ratio);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', .82));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function setOnlineStatus(message) { qs('#onlineStatus').textContent = message || ''; }
    async function fetchJson(url, options = {}) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } finally { clearTimeout(timeout); }
    }
    async function fetchSpanishTitleFromWikidata(imdbID) {
      if (!imdbID) return '';
      const query = `SELECT ?label WHERE { ?item wdt:P345 "${imdbID}". ?item rdfs:label ?label. FILTER(LANG(?label) = "es") } LIMIT 1`;
      try {
        const data = await fetchJson(`https://query.wikidata.org/sparql?query=${encodeURIComponent(query)}&format=json`, { headers: { 'Accept': 'application/sparql-results+json' } });
        return data?.results?.bindings?.[0]?.label?.value || '';
      } catch (_) { return ''; }
    }
    async function searchOmdb(type, query) {
      const omdbType = type === 'Serie' ? 'series' : 'movie';
      const searchData = await fetchJson(`https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&s=${encodeURIComponent(query)}&type=${omdbType}`);
      const rows = (searchData.Search || []).slice(0, 5);
      const results = [];
      for (const row of rows) {
        const detail = await fetchJson(`https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&i=${encodeURIComponent(row.imdbID)}&plot=short`);
        const spanishTitle = await fetchSpanishTitleFromWikidata(row.imdbID);
        results.push({
          type,
          title: spanishTitle || detail.Title || row.Title || '',
          originalTitle: detail.Title || row.Title || '',
          year: normalizeYear(detail.Year || row.Year),
          person: detail.Director && detail.Director !== 'N/A' ? detail.Director : '',
          genre: translateGenreList(detail.Genre || ''),
          platform: '',
          language: '',
          description: detail.Plot && detail.Plot !== 'N/A' ? detail.Plot : '',
          image: detail.Poster && detail.Poster !== 'N/A' ? detail.Poster : '',
          source: 'OMDb'
        });
      }
      return results;
    }
    async function searchOpenLibrary(query) {
      const data = await fetchJson(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=5&language=spa`);
      return (data.docs || []).slice(0, 5).map(doc => ({
        type: 'Libro',
        title: doc.title || '',
        originalTitle: doc.title || '',
        year: doc.first_publish_year ? String(doc.first_publish_year) : '',
        person: (doc.author_name || []).slice(0, 2).join(', '),
        genre: translateGenreList((doc.subject || []).slice(0, 3).join(', ')),
        platform: '',
        language: 'Castellano',
        description: 'Libro',
        image: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg` : '',
        source: 'Open Library'
      }));
    }

    function romanToArabic(text) { return clean(text).replace(/\biv\b/ig, '4').replace(/\biii\b/ig, '3').replace(/\bii\b/ig, '2').replace(/\bvi\b/ig, '6').replace(/\bv\b/ig, '5'); }
    function normalizeGame(value) { return normalizeText(romanToArabic(value)); }
    function stripGameEdition(title) {
      let value = clean(title);
      value = value.replace(/\s*[\[(][^\])]*(demo|trial|beta|alpha|preview|prototype|soundtrack|ost|dlc|expansion|season pass|pack|ps\d|xbox|switch|windows|pc|mac|ios|android|remaster|remastered|edition|version|collection|bundle|platinum|essentials|hits)[^\])]*[\])]\s*/ig, ' ');
      value = value.replace(/\s+-\s+.*\b(game of the year|goty|complete|definitive|deluxe|ultimate|special|collector'?s?|anniversary|enhanced|remaster(ed)?|hd|redux|edition|version|bundle|collection|platinum|essentials|hits|demo|trial|beta|soundtrack|ost|dlc|expansion|season pass|pack)\b.*$/ig, '');
      value = value.replace(/\s*:\s+.*\b(game of the year|goty|complete|definitive|deluxe|ultimate|special|collector'?s?|anniversary|enhanced|remaster(ed)?|hd|redux|edition|version|bundle|collection|platinum|essentials|hits|demo|trial|beta|soundtrack|ost|dlc|expansion|season pass|pack)\b.*$/ig, '');
      value = value.replace(/\b(game of the year|goty|complete|definitive|deluxe|ultimate|special|collector'?s?|anniversary|enhanced|remaster(ed)?|hd|redux|edition|version|platinum|essentials|hits)\b/ig, '');
      return value.replace(/\s{2,}/g, ' ').replace(/\s+([:;,.])/g, '$1').trim();
    }
    function canonicalGameKey(title) { return normalizeGame(stripGameEdition(title)); }
    function isLowValueGameVariant(title) { return /\b(demo|trial|beta|alpha|prototype|preview|soundtrack|ost|dlc|add on|expansion|pack|season pass|wallpaper|trailer)\b/.test(normalizeText(title)); }
    function scoreGameName(name, query) {
      const n = normalizeGame(stripGameEdition(name));
      const raw = normalizeGame(name);
      const q = normalizeGame(query);
      if (!n || !q) return 0;
      let score = 0;
      if (n === q) score = 1200;
      else if (n.startsWith(q)) score = 1060 - Math.max(0, n.length - q.length);
      else if (n.includes(q)) score = 900 - n.indexOf(q);
      else {
        const tokens = q.split(' ').filter(Boolean);
        if (tokens.length && tokens.every(t => n.includes(t) || raw.includes(t))) score = 760 - Math.abs(n.length - q.length);
      }
      if (/\b(game of the year|goty|complete|definitive|deluxe|ultimate|special|collector|anniversary|enhanced|remastered|remaster|hd|edition|version|collection|bundle|platinum|essentials|hits)\b/i.test(name)) score -= 65;
      if (isLowValueGameVariant(name)) score -= 500;
      return Math.max(0, score);
    }
    function bucketFor(query) {
      const text = normalizeGame(query).replace(/ /g, '');
      if (!text) return '@';
      return text.length >= 2 ? text.slice(0, 2) : text.slice(0, 1);
    }
    async function fetchGameDbPath(path) {
      let lastError;
      for (const base of GAME_DB_BASES) {
        try { return await fetchJson(`${base}/${path.replace(/^\//, '')}`, { mode: 'cors', cache: 'force-cache' }); }
        catch (error) { lastError = error; }
      }
      throw lastError || new Error('No se pudo consultar GameDB');
    }
    async function fetchBucket(bucket) {
      const data = await fetchGameDbPath(`buckets/${encodeURIComponent(bucket)}.json`);
      return Object.entries(data || {}).map(([id, value]) => ({ id, name: clean(value?.name || value?.title || value) })).filter(item => item.id && item.name && !isLowValueGameVariant(item.name));
    }
    async function fetchGameDetail(id) { return await fetchGameDbPath(`games/${encodeURIComponent(id)}.json`); }
    function namesFrom(list) { return (Array.isArray(list) ? list : []).map(item => clean(item?.name || item)).filter(Boolean); }
    function companies(game, flag) {
      return (Array.isArray(game.involved_companies) ? game.involved_companies : []).filter(item => item && item[flag]).map(item => clean(item.company?.name || item.company_name || item.name)).filter(Boolean);
    }
    function gameImageUrl(value, size = 't_cover_big_2x') {
      let url = '';
      if (!value) return '';
      if (typeof value === 'string') url = value;
      else if (value.url) url = value.url;
      else if (value.image_id) return `https://images.igdb.com/igdb/image/upload/${size}/${value.image_id}.jpg`;
      if (!url) return '';
      if (url.startsWith('//')) url = `https:${url}`;
      if (url.startsWith('http://')) url = url.replace('http://', 'https://');
      return url.replace('/t_thumb/', `/${size}/`).replace('/t_cover_small/', `/${size}/`).replace('/t_720p/', `/${size}/`);
    }
    function yearFromGame(game) {
      const releases = Array.isArray(game.release_dates) ? game.release_dates : [];
      const releaseYear = releases.map(r => Number(r.y || '')).filter(Boolean).sort((a, b) => a - b)[0];
      if (releaseYear) return String(releaseYear);
      const date = Number(game.first_release_date || 0);
      if (!date) return '';
      try { return String(new Date(date * 1000).getUTCFullYear()); } catch (_) { return ''; }
    }
    function translateGameTag(tag) { return GAME_GENRE_ES[normalizeText(tag)] || clean(tag); }
    function gameDbToResult(game) {
      const originalTitle = clean(game.name || game.title);
      const title = stripGameEdition(originalTitle) || originalTitle;
      const genreTags = unique([...namesFrom(game.genres), ...namesFrom(game.themes)]).map(translateGameTag);
      const devs = companies(game, 'developer');
      const pubs = companies(game, 'publisher');
      const cover = gameImageUrl(game.cover) || gameImageUrl((game.artworks || [])[0]) || gameImageUrl((game.screenshots || [])[0]);
      return { type: 'Videojuego', id: `gamedb-${game.id || title}`, gameDbId: game.id || '', title, originalTitle, year: yearFromGame(game), person: unique(devs).slice(0, 2).join(', ') || unique(pubs).slice(0, 2).join(', '), genre: unique(genreTags).slice(0, 3).join(', '), platform: '', language: '', description: clean(game.summary || game.storyline || 'Videojuego'), image: cover, source: 'GameDB' };
    }
    function dedupeGameResults(items, query) {
      const byKey = new Map();
      items.forEach(item => {
        const title = clean(item.title);
        const key = canonicalGameKey(title);
        if (!key) return;
        const baseScore = scoreGameName(item.originalTitle || title, query) || scoreGameName(title, query);
        if (!baseScore) return;
        const quality = baseScore + (item.image ? 45 : 0) + (item.year ? 20 : 0) + (item.person ? 10 : 0) + (item.genre ? 10 : 0) - (isLowValueGameVariant(item.originalTitle || title) ? 300 : 0);
        const current = byKey.get(key);
        if (!current || quality > current._quality) byKey.set(key, { ...item, _quality: quality, _score: baseScore });
      });
      return Array.from(byKey.values()).sort((a, b) => (b._score - a._score) || (b._quality - a._quality) || clean(a.title).localeCompare(clean(b.title))).map(({ _quality, _score, ...item }) => item).slice(0, 5);
    }
    async function searchGameDb(query) {
      const norm = normalizeGame(query);
      const tokens = norm.split(' ').filter(t => t.length > 1);
      const compact = norm.replace(/\s+/g, '');
      const seeds = [query, norm, compact, ...tokens, tokens.join('')];
      if (/^gta\b|\bgta\b/.test(norm) || norm.includes('grand theft auto')) seeds.push('gta', 'grand theft auto');
      const buckets = unique([...seeds.map(bucketFor), ...seeds.map(seed => normalizeGame(seed).replace(/\s+/g, '').slice(0, 1)).filter(Boolean)]).slice(0, 12);
      let summaries = [];
      for (const bucket of buckets) {
        try { summaries = summaries.concat(await fetchBucket(bucket)); } catch (_) {}
      }
      const ranked = unique(summaries.map(item => item.id)).map(id => summaries.find(item => item.id === id)).map(item => ({ ...item, score: scoreGameName(item.name, query) })).filter(item => item.score > 0).sort((a, b) => b.score - a.score || clean(a.name).localeCompare(clean(b.name))).slice(0, 45);
      const details = [];
      for (const item of ranked) {
        try { details.push(gameDbToResult(await fetchGameDetail(item.id))); }
        catch (_) { details.push({ type: 'Videojuego', id: `gamedb-summary-${item.id}`, gameDbId: item.id, title: stripGameEdition(item.name) || item.name, originalTitle: item.name, year: '', person: '', genre: '', platform: '', language: '', description: 'Videojuego', image: '', source: 'GameDB' }); }
      }
      return dedupeGameResults(details, query);
    }
    async function searchOnline() {
      const type = qs('#onlineSource').value;
      const query = clean(qs('#onlineSearch').value);
      qs('#onlineResults').innerHTML = '';
      onlineResults = [];
      if (!query) { setOnlineStatus('Escribe un título para buscar.'); return; }
      setOnlineStatus('Buscando online...');
      try {
        if (type === 'Libro') onlineResults = await searchOpenLibrary(query);
        else if (type === 'Videojuego') onlineResults = await searchGameDb(query);
        else onlineResults = await searchOmdb(type, query);
        renderOnlineResults();
        setOnlineStatus(onlineResults.length ? `${onlineResults.length} resultado(s). Toca uno para completar el formulario.` : 'No he encontrado resultados claros. Prueba con el título original completo.');
      } catch (error) {
        console.error(error);
        setOnlineStatus(type === 'Videojuego' ? 'No se pudo conectar con GameDB en este momento. Puedes escribir el registro manualmente.' : 'No se pudo completar la búsqueda. Puedes escribir el registro manualmente.');
      }
    }
    function renderOnlineResults() {
      qs('#onlineResults').innerHTML = onlineResults.map((item, index) => `<button type="button" class="search-result" data-online-index="${index}">${item.image ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}">` : '<div class="search-result-placeholder"></div>'}<div><strong>${escapeHtml(item.title)}</strong><div class="entry-info">${escapeHtml([item.year, item.genre, item.person].filter(Boolean).join(' · ') || item.description || item.source || '')}</div><div class="entry-info">${escapeHtml(item.source || '')}</div></div></button>`).join('');
      qsa('[data-online-index]', qs('#onlineResults')).forEach(btn => btn.addEventListener('click', () => loadOnlineResult(Number(btn.dataset.onlineIndex))));
    }
    function loadOnlineResult(index) {
      const item = onlineResults[index];
      if (!item) return;
      qs('#entryType').value = item.type;
      updateDateFields();
      updateStatusOptions('');
      qs('#entryTitle').value = item.title || '';
      qs('#entryYear').value = item.year || '';
      qs('#entryPerson').value = item.person || '';
      qs('#entryGenre').value = item.genre || '';
      qs('#entryPlatform').value = item.platform || '';
      qs('#entryLanguage').value = item.language || '';
      if (item.image) { currentCover = item.image; qs('#coverPreview').src = item.image; qs('#coverPreview').style.display = 'block'; }
      qs('#onlineResults').innerHTML = '';
      qs('#onlineSearch').value = '';
      setOnlineStatus('Datos cargados en el formulario.');
    }

    async function exportJson() {
      const blob = new Blob([JSON.stringify(supportedEntries(), null, 2)], { type: 'application/json' });
      const date = new Date();
      const filename = `cuaderno_bitacora_${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}.json`;
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    }
    async function importJson(file) {
      const text = await file.text();
      const data = JSON.parse(text);
      const rows = Array.isArray(data) ? data : Array.isArray(data.entries) ? data.entries : null;
      if (!rows) throw new Error('El archivo JSON no contiene una lista de registros válida.');
      entries = rows.map(normalizeEntry).filter(Boolean);
      await saveEntries();
      renderAll();
    }

    function bindEvents() {
      qsa('.nav-btn').forEach(btn => btn.addEventListener('click', () => showScreen(btn.dataset.screen)));
      qs('#openAddFromNav').addEventListener('click', () => { clearForm(); openModal('formModal'); });
      qs('#entryType').addEventListener('change', () => { updateDateFields(); updateStatusOptions(''); });
      qs('#onlineSource').addEventListener('change', () => { const type = qs('#onlineSource').value; qs('#entryType').value = type; updateDateFields(); updateStatusOptions(qs('#entryStatus').value); qs('#onlineResults').innerHTML = ''; });
      qs('#entryCover').addEventListener('change', async event => { const file = event.target.files?.[0]; if (!file) return; currentCover = await resizeImageFile(file); qs('#coverPreview').src = currentCover; qs('#coverPreview').style.display = 'block'; });
      qs('#entryForm').addEventListener('submit', handleSave);
      qs('#clearFormButton').addEventListener('click', clearForm);
      qs('#cancelEditButton').addEventListener('click', clearForm);
      qs('#onlineSearchButton').addEventListener('click', searchOnline);
      qs('#onlineSearch').addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); searchOnline(); } });
      qs('#searchInput').addEventListener('input', renderLibrary);
      qs('#listFilter').addEventListener('change', renderLibrary);
      qs('#sortFilter').addEventListener('change', renderLibrary);
      qs('#statusQuickFilter').addEventListener('change', renderLibrary);
      qsa('.filter-picker-button').forEach(button => button.addEventListener('click', event => { event.stopPropagation(); openFloatingFilterMenu(button); }));
      qs('#filterPanel').addEventListener('click', event => { const option = event.target.closest('.filter-option'); if (!option) return; const select = qs(option.dataset.select); if (!select) return; select.value = option.dataset.value; closeFilterMenus(); renderLibrary(); });
      document.addEventListener('click', event => { const option = event.target.closest('.floating-filter-option'); if (!option) return; event.stopPropagation(); const menu = option.closest('.floating-filter-menu'); const select = qs(menu?.dataset.select || ''); if (!select) return; select.value = option.dataset.value; closeFilterMenus(); renderLibrary(); });
      document.addEventListener('click', event => { if (!event.target.closest('.filter-picker') && !event.target.closest('.filter-menu') && !event.target.closest('.floating-filter-menu')) closeFilterMenus(); });
      window.addEventListener('resize', closeFilterMenus);
      qs('#clearQuickFilters').addEventListener('click', () => { qs('#searchInput').value = ''; libraryType = ''; qs('#listFilter').value = 'Todas'; qs('#sortFilter').value = 'dateDesc'; qs('#statusQuickFilter').value = 'Todos'; closeFilterMenus(); renderHeroCovers('', true); renderLibrary(); });
      qs('#exportButton').addEventListener('click', exportJson);
      qs('#importInput').addEventListener('change', async event => { const file = event.target.files?.[0]; if (!file) return; try { await importJson(file); alert('Copia importada correctamente.'); } catch (error) { console.error(error); alert('No se pudo importar el archivo JSON.'); } finally { event.target.value = ''; } });
      qsa('[data-close]').forEach(btn => btn.addEventListener('click', () => closeModal(btn.dataset.close)));
      qsa('.modal-backdrop').forEach(backdrop => backdrop.addEventListener('click', event => { if (event.target === backdrop) closeModal(backdrop.id); }));
      qs('#coverLightboxBack').addEventListener('click', closeCoverLightbox);
      qs('#coverLightbox').addEventListener('click', event => { if (event.target.id === 'coverLightbox') closeCoverLightbox(); });
    }

    async function init() {
      db = await openDB();
      await requestPersistentStorage();
      await loadEntries();
      bindEvents();
      updateDateFields();
      updateStatusOptions('');
      renderAll();
    }
    init().catch(error => {
      console.error(error);
      document.body.innerHTML = '<div style="padding:24px;color:white;font-family:var(--font-sans);">No se pudo iniciar la aplicación.</div>';
    });
  })();
  </script>
